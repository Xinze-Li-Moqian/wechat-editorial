name: Build and check example
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_article.py examples/article.json --output dist/preview.html
      - run: python scripts/check_article.py dist/preview.html
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-preview
          path: dist/preview.html
